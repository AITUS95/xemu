name: Pre-release

on:
  push:
    branches:
      - master

permissions:
  actions: write
  contents: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  release:
    name: Pre-release
    if: github.repository_owner == 'AITUS95' && github.event.head_commit.message != 'ci-rebuild-v0.8.136'
    uses: ./.github/workflows/release.yml
    with:
      ref: ${{ github.sha }}
      tag: pre-release
      pre-release: true
