name: Rebuild v0.8.136

on:
  push:
    branches:
      - master

permissions:
  actions: write
  contents: write

jobs:
  release:
    name: Rebuild v0.8.136
    if: github.event.head_commit.message == 'ci-rebuild-v0.8.136'
    uses: ./.github/workflows/release.yml
    with:
      ref: ${{ github.sha }}
      tag: v0.8.136
      pkg_version: 0.8.136
      publish: true
