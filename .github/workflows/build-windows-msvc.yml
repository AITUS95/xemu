name: Build for Windows (MSVC probe)

env:
  VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\.vcpkg-binary-cache
  VCPKG_FEATURE_FLAGS: binarycaching

on:
  push:
    branches:
      - MSVC
    paths:
      - ".github/workflows/**"
      - "scripts/ci/**"
      - "include/**"
      - "ui/**"
      - "util/**"
      - "meson.build"
      - "meson_options.txt"
      - "subprojects/**"
      - "winpcap-loader/**"
      - "config_spec.yml"
  workflow_dispatch:
    inputs:
      build_scope:
        description: "MSVC probe scope"
        required: false
        default: "fast"
        type: choice
        options:
          - fast
          - full
      strict:
        description: Fail the workflow when the MSVC probe fails
        required: false
        type: boolean
        default: false
      configure_args:
        description: Extra arguments appended to configure
        required: false
        type: string
        default: ""

concurrency:
  group: msvc-probe-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  configure:
    name: Build with MSVC (${{ matrix.arch }})
    runs-on: windows-2022
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            vc_arch: amd64
            qemu_cpu: x86_64
    steps:
      - name: Clone tree
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4
        with:
          fetch-depth: 1
          fetch-tags: true

      - name: Restore vcpkg binary cache
        uses: actions/cache/restore@v4
        with:
          path: |
            .vcpkg-binary-cache
            C:\vcpkg\downloads
            C:\Users\runneradmin\AppData\Local\vcpkg\archives
            subprojects\packagecache
          key: msvc-vcpkg-${{ runner.os }}-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            msvc-vcpkg-${{ runner.os }}-v1-
            msvc-vcpkg-${{ runner.os }}-

      - name: Run MSVC fast build probe
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_scope == 'fast' }}
        shell: pwsh
        timeout-minutes: 40
        env:
          STRICT: ${{ inputs.strict || 'false' }}
          EXTRA_CONFIGURE_ARGS: ${{ inputs.configure_args || '' }}
        run: |
          $strict = [System.Convert]::ToBoolean($env:STRICT)
          .\scripts\ci\windows-msvc-probe.ps1 `
            -Architecture "${{ matrix.vc_arch }}" `
            -QemuCpu "${{ matrix.qemu_cpu }}" `
            -BuildScope "fast" `
            -ExtraConfigureArgs "$env:EXTRA_CONFIGURE_ARGS" `
            -Strict:$strict

      - name: Run MSVC full build probe
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_scope == 'full' }}
        shell: pwsh
        timeout-minutes: 60
        env:
          STRICT: ${{ inputs.strict || 'false' }}
          EXTRA_CONFIGURE_ARGS: ${{ inputs.configure_args || '' }}
        run: |
          $strict = [System.Convert]::ToBoolean($env:STRICT)
          .\scripts\ci\windows-msvc-probe.ps1 `
            -Architecture "${{ matrix.vc_arch }}" `
            -QemuCpu "${{ matrix.qemu_cpu }}" `
            -BuildScope "full" `
            -ExtraConfigureArgs "$env:EXTRA_CONFIGURE_ARGS" `
            -Strict:$strict

      - name: Save vcpkg binary cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            .vcpkg-binary-cache
            C:\vcpkg\downloads
            C:\Users\runneradmin\AppData\Local\vcpkg\archives
            subprojects\packagecache
          key: msvc-vcpkg-${{ runner.os }}-v1-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload MSVC probe logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: msvc-probe-${{ matrix.arch }}
          path: |
            msvc-probe-logs
            msvc-probe-artifacts
          if-no-files-found: warn
