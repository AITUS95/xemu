name: Repair v0.8.136

on:
  push:
    branches:
      - master

permissions:
  actions: read
  contents: write

jobs:
  release:
    name: Repair v0.8.136
    if: github.event.head_commit.message == 'ci-repair-v0.8.136'
    runs-on: ubuntu-latest
    steps:
      - name: Clone tree
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4
        with:
          fetch-depth: 0

      - name: Generate release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/gen-changelog.py --ref ${{ github.sha }} -o CHANGELOG.md

      - name: Download artifacts from failed release run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v4
        with:
          run-id: 29241272607
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          path: dist
          merge-multiple: true

      - name: Filter and prepare assets
        run: |
          find dist -type f -name '*.tgz' -delete
          find dist -type f \( -name '*-macos-arm64-unsigned.zip' -o -name '*-macos-x86_64-unsigned.zip' \) -delete
          rm -f dist/xemu-msvc-debug.zip dist/xemu-msvc-profile.zip
          cp dist/xemu-0.8.136-macos-universal-unsigned.zip dist/xemu-0.8.136-macos-universal.zip
          cp dist/xemu-0.8.136-windows-x86_64.zip dist/xemu-win-x86_64-release.zip
          cp dist/xemu-0.8.136-windows-arm64.zip dist/xemu-win-aarch64-release.zip
          mv dist/xemu-msvc-release.zip dist/xemu-0.8.136-msvc-release.zip

      - name: Delete existing stable release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          release_id="$(gh api "repos/$GH_REPO/releases/tags/v0.8.136" 2>/dev/null | jq -r '.id // empty' || true)"
          if [ -n "$release_id" ]; then
            gh api --method DELETE "repos/$GH_REPO/releases/$release_id"
          fi

      - name: Create release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          name: v0.8.136
          tag_name: v0.8.136
          target_commitish: ${{ github.sha }}
          body_path: CHANGELOG.md
          draft: false
          prerelease: false
          make_latest: false
          files: |
            dist/xemu*.tar.zst
            dist/xemu*-win*.zip
            dist/xemu*-macos-universal*.zip
            dist/xemu*.AppImage
            dist/xemu*-msvc-*.zip

      - name: Keep stable release below development build
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          stable_id="$(gh api "repos/$GH_REPO/releases?per_page=100" --jq '.[] | select(.draft == false and .prerelease == false) | .id' | head -n 1)"
          if [ -n "$stable_id" ]; then
            gh api --method PATCH "repos/$GH_REPO/releases/$stable_id" -f make_latest=false >/dev/null
          fi
