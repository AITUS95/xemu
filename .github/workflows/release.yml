name: Release

on:
  workflow_call:
    inputs:
      ref:
        description: "Git ref to build and release"
        required: true
        type: string
      tag:
        description: "Tag name for the release"
        required: true
        type: string
      pkg_version:
        description: "Explicit package version without a leading v"
        required: false
        type: string
      pre-release:
        description: "Create as published pre-release instead of draft release"
        required: false
        type: boolean
        default: false

permissions:
  actions: write
  contents: write

jobs:
  build:
    name: Build
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ inputs.ref }}
      pkg_version: ${{ inputs.pkg_version }}

  msvc:
    name: Windows MSVC
    needs: build
    uses: ./.github/workflows/windows-msvc.yml
    with:
      ref: ${{ inputs.ref }}
      pkg_version: ${{ needs.build.outputs.pkg_version }}

  delete_prerelease:
    name: Delete pre-release
    needs: [build, msvc]
    if: ${{ inputs.pre-release }}
    uses: ./.github/workflows/delete-prerelease.yml

  release:
    name: Create release
    runs-on: ubuntu-latest
    needs: [build, msvc, delete_prerelease]
    if: >-
      ${{ always() && needs.build.result == 'success' &&
      needs.msvc.result == 'success' &&
      (needs.delete_prerelease.result == 'success' ||
      needs.delete_prerelease.result == 'skipped') }}
    steps:
    - name: Clone tree
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4
      with:
        fetch-depth: 0
        ref: ${{ inputs.ref }}
    - name: Generate release notes
      env:
        GH_TOKEN: ${{ github.token }}
      run: python3 .github/scripts/gen-changelog.py --ref ${{ inputs.ref }} -o CHANGELOG.md
    - name: Download artifacts
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v4
      with:
        path: dist
        merge-multiple: true
    - name: Keep release builds only
      run: |
        find dist -type f \( \
          -name '*-dbg-*' -o \
          -name '*-dbg.*' -o \
          -name '*-debug.tgz' -o \
          -name '*-pdb.zip' -o \
          -name '*.tgz' \
        \) -delete
        rm -f dist/xemu-msvc-debug.zip dist/xemu-msvc-profile.zip
    - name: Add transitionary package aliases
      if: ${{ !inputs.pre-release }}
      run: |
        pushd dist
        cp xemu-${{ needs.build.outputs.pkg_version }}-windows-x86_64.zip xemu-win-x86_64-release.zip
        cp xemu-${{ needs.build.outputs.pkg_version }}-windows-arm64.zip xemu-win-aarch64-release.zip
    - name: Normalize release asset names
      env:
        RELEASE_REF: ${{ inputs.ref }}
      run: |
        set -euo pipefail

        commit="$(git rev-parse --short=10 "$RELEASE_REF")"
        if [[ "${{ inputs.tag }}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          release_version="${{ inputs.tag }}"
          release_version="${release_version#v}"
        else
          release_version="$(git describe --tags --match 'v*' --abbrev=0 "$RELEASE_REF" 2>/dev/null || true)"
          release_version="${release_version#v}"
        fi
        if [ -z "$release_version" ]; then
          release_version="0.0.0"
        fi

        for file in dist/*.tar.zst; do
          [ -f "$file" ] || continue
          mv "$file" "dist/xemu-source-${release_version}-${commit}.tar.zst"
        done

        for file in dist/*.AppImage; do
          [ -f "$file" ] || continue
          base="${file##*/}"
          case "$base" in
            *aarch64*) asset_type="linux-aarch64-release" ;;
            *x86_64*) asset_type="linux-x86_64-release" ;;
            *) continue ;;
          esac
          mv "$file" "dist/xemu-${asset_type}-${release_version}-${commit}.AppImage"
        done

        for file in dist/*.zip; do
          [ -f "$file" ] || continue
          base="${file##*/}"
          case "$base" in
            xemu-win-*) continue ;;
            xemu-msvc-release.zip) asset_type="msvc-release" ;;
            xemu-msvc-profile.zip) asset_type="msvc-profile" ;;
            xemu-msvc-debug.zip) asset_type="msvc-debug" ;;
            *-windows-x86_64-msvc-release.zip) asset_type="msvc-release" ;;
            *-windows-x86_64-msvc-profile.zip) asset_type="msvc-profile" ;;
            *-windows-x86_64-msvc-debug.zip) asset_type="msvc-debug" ;;
            *-windows-x86_64.zip) asset_type="windows-x86_64-release" ;;
            *-windows-arm64.zip) asset_type="windows-arm64-release" ;;
            *-macos-universal-unsigned.zip) asset_type="macos-universal-release" ;;
            *-macos-arm64-unsigned.zip) asset_type="macos-arm64-release" ;;
            *-macos-x86_64-unsigned.zip) asset_type="macos-x86_64-release" ;;
            *) continue ;;
          esac
          mv "$file" "dist/xemu-${asset_type}-${release_version}-${commit}.zip"
        done
    - name: Create release
      uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
      with:
        name: ${{ inputs.pre-release && 'Latest Development Build' || inputs.tag }}
        tag_name: ${{ inputs.tag }}
        target_commitish: ${{ inputs.ref }}
        body_path: CHANGELOG.md
        draft: ${{ !inputs.pre-release }}
        prerelease: ${{ inputs.pre-release }}
        make_latest: false
        files: |
          dist/xemu*.tar.zst
          dist/xemu*.zip
          dist/xemu*.AppImage

    - name: Keep stable release below development build
      if: ${{ inputs.pre-release }}
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
      run: |
        set -euo pipefail
        stable_id="$(gh api "repos/$GH_REPO/releases?per_page=100" \
          --jq '.[] | select(.draft == false and .prerelease == false) | .id' | head -n 1)"
        if [ -n "$stable_id" ]; then
          gh api --method PATCH "repos/$GH_REPO/releases/$stable_id" \
            -f make_latest=false >/dev/null
        fi
