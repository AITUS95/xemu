name: Build for Windows

on:
  workflow_call:
    inputs:
      pkg_version:
        description: Build version
        required: true
        type: string

jobs:
  build:
    name: Build for Windows (${{ matrix.arch }}, ${{ matrix.configuration }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [x86_64, arm64]
        configuration: [debug, release]
    container:
      image: ghcr.io/xemu-project/xemu-win64-toolchain${{ matrix.arch == 'x86_64' && '-gcc:sha-2881edd' || ':sha-0d06ce8' }}
    defaults:
      run:
        shell: bash
    env:
      CCACHE_DIR: /tmp/xemu-ccache
      CCACHE_MAXSIZE: 512M
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_NOHASHDIR: "true"
      LTO_CACHE_DIR: /tmp/xemu-lto-ccache
      CROSSPREFIX: ${{ matrix.arch == 'arm64' && 'aarch64' || 'x86_64' }}-w64-mingw32.static-
      CROSSAR: ${{ matrix.arch == 'arm64' && 'aarch64' || 'x86_64' }}-w64-mingw32.static-${{ matrix.arch == 'arm64' && 'ar' || 'gcc-ar' }}
    steps:
    - name: Download source package
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v4
      with:
        name: src
    - name: Install curl
      run: |
        apt-get update
        apt-get install -qy curl
    - name: Install zstd
      if: ${{ matrix.arch == 'arm64' }}
      run: apt-get install zstd
    - name: Initialize compiler cache
      id: cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v4
      with:
        path: |
          .incremental-src
          ${{ env.CCACHE_DIR }}
          ${{ env.LTO_CACHE_DIR }}
        key: cache-wincross-${{ runner.os }}-${{ matrix.arch }}-${{ matrix.configuration }}-${{ github.sha }}
        restore-keys: cache-wincross-${{ runner.os }}-${{ matrix.arch }}-${{ matrix.configuration }}-
    - name: Update incremental source tree
      run: |
        rm -rf _src_new
        mkdir -p _src_new .incremental-src
        tar -xf xemu-${{ inputs.pkg_version }}.tar.zst -C _src_new --strip-components=2
        python3 - <<'PY'
        import filecmp
        import os
        import shutil
        from pathlib import Path

        src = Path("_src_new")
        dst = Path(".incremental-src")
        keep_roots = {"build", "dist", "pdb-build", "build.log"}
        keep_prefixes = (".build-config-",)

        for path in sorted(dst.rglob("*"), reverse=True):
            rel = path.relative_to(dst)
            if rel.parts and rel.parts[0] in keep_roots:
                continue
            if rel.name.startswith(keep_prefixes):
                continue
            other = src / rel
            if not other.exists():
                if path.is_dir():
                    try:
                        path.rmdir()
                    except OSError:
                        pass
                else:
                    path.unlink()

        for path in src.rglob("*"):
            rel = path.relative_to(src)
            out = dst / rel
            if path.is_dir():
                if out.exists() and not out.is_dir():
                    out.unlink()
                out.mkdir(parents=True, exist_ok=True)
                continue
            out.parent.mkdir(parents=True, exist_ok=True)
            if out.exists() and filecmp.cmp(path, out, shallow=False):
                continue
            if out.exists() and out.is_dir():
                shutil.rmtree(out)
            shutil.copy2(path, out)
        PY
        rm -rf _src_new
    - name: Setup ccache
      run: |
        mkdir -p ${CCACHE_DIR} /tmp/ccache-wrappers
        for tool in gcc g++; do
          ln -sf "$(command -v ccache)" "/tmp/ccache-wrappers/${CROSSPREFIX}${tool}"
        done
        echo "PATH=/tmp/ccache-wrappers:$PATH" >> "$GITHUB_ENV"
        ccache -z
    - name: Setup build options
      run: |
        opts=(
          --enable-vulkan
        )
        if [[ "${{ matrix.configuration }}" == "debug" ]]; then
          opts+=(
            --debug
          )
        elif [[ "${{ matrix.arch }}" == "x86_64" ]]; then
          opts+=(
            --extra-cflags="-flto-incremental=${LTO_CACHE_DIR} -flto-partition=cache"
            -Db_lto=true
            -Dx86_version=3
          )
          mkdir -p ${LTO_CACHE_DIR}
        elif [[ "${{ matrix.arch }}" == "arm64" ]]; then
          # FIXME: llvm-mingw ThinLTO has an issue with `qemu_build_not_reached_always`
          #        being intentionaly undefined (to ensure 'unreachable' paths are
          #        optimized out). Regular LTO doesn't pass cv2pdb. Resolve linking
          #        failure and have llvm toolchain generate PDB directly.
          :
        fi
        echo "XEMU_BUILD_OPTIONS=${opts[*]}" >> "$GITHUB_ENV"
    - name: Compile
      run: |
        cd .incremental-src
        stamp_file=.build-config-win64-${{ matrix.arch }}-${{ matrix.configuration }}
        stamp_value="$(printf '%s\n' \
          "${{ matrix.arch }}" \
          "${{ matrix.configuration }}" \
          "${XEMU_BUILD_OPTIONS}" \
          "$(sha256sum build.sh configure meson.build meson_options.txt scripts/meson-buildoptions.sh | sha256sum | cut -d' ' -f1)")"

        if [[ -f build/Makefile && -f "${stamp_file}" ]] && cmp -s "${stamp_file}" <(printf '%s' "${stamp_value}"); then
          make -C build -j"$(nproc)" qemu-system-i386w.exe 2>&1 | tee build.log
          rm -rf dist
          mkdir -p dist
          cp build/qemu-system-i386w.exe dist/xemu.exe
          python3 ./scripts/gen-license.py --platform windows > dist/LICENSE.txt
        else
          ./build.sh -p win64-cross ${XEMU_BUILD_OPTIONS}
          printf '%s' "${stamp_value}" > "${stamp_file}"
        fi
        grep -q '^CONFIG_VULKAN=y$' build/config-host.mak || {
          echo "CONFIG_VULKAN is not enabled in the Windows build"
          exit 1
        }
    - name: Report ccache stats
      run: ccache -s
    - name: Upload build artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
      with:
        name: xemu-windows-${{ matrix.arch }}-${{ matrix.configuration }}
        path: .incremental-src/dist
    - name: Cleanup incremental tree
      if: always()
      run: rm -rf .incremental-src/dist .incremental-src/pdb-build

  # Generate a symbols package for Windows. Use cv2pdb to generate PDBs from
  # DWARF and update + strip the executable. Re-package the original release
  # and create symbols package.
  generate_pdb:
    name: Generate PDB for Windows (${{ matrix.arch }}, ${{ matrix.configuration }})
    runs-on: windows-latest
    needs: build
    strategy:
      matrix:
        arch: [x86_64, arm64]
        configuration: [debug, release]
    steps:
    - name: Download artifacts
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v4
      with:
        name: xemu-windows-${{ matrix.arch }}-${{ matrix.configuration }}
        path: dist
    - name: Generate PDB
      run: |
        Invoke-WebRequest -Uri "https://github.com/rainers/cv2pdb/releases/download/v0.54/cv2pdb-0.54.zip" -OutFile "cv2pdb.zip"
        7z x -ocv2pdb -y cv2pdb.zip
        cd dist
        ../cv2pdb/cv2pdb64.exe xemu.exe
    - name: Determine package version
      id: package_id
      shell: bash
      env:
        VERSION: ${{ inputs.pkg_version }}${{ matrix.configuration == 'debug' && '-dbg' || '' }}
      run: |
        echo "pkg_filename=xemu-${VERSION}-windows-${{ matrix.arch }}.zip" >> $GITHUB_OUTPUT
        echo "pdb_filename=xemu-${VERSION}-windows-${{ matrix.arch }}-pdb.zip" >> $GITHUB_OUTPUT
    - name: Package
      run: |
        mkdir dist-pdb
        cd dist
        7z a -tzip ../dist-pdb/${{ steps.package_id.outputs.pkg_filename}} * "-xr!*.pdb"
        7z a -tzip ../dist-pdb/${{ steps.package_id.outputs.pdb_filename}} "-ir!*.pdb"
    - name: Upload build artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
      with:
        name: xemu-windows-${{ matrix.arch }}-${{ matrix.configuration }}-pdb
        path: dist-pdb
        compression-level: 0
