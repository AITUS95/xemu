name: Windows MSVC Build

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  VCPKG_ROOT: ${{ github.workspace }}\.vcpkg-tool
  VCPKG_DOWNLOADS: ${{ github.workspace }}\.vcpkg-downloads
  VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\.vcpkg-binary-cache
  VCPKG_FEATURE_FLAGS: binarycaching

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref (commit, branch, or tag) to build
        required: true
        type: string
      pkg_version:
        description: Build version used for release packages
        required: true
        type: string
  push:
    branches:
      - MSVC
      - agent/audio-resampler-option
    paths:
      - ".github/workflows/**"
      - "scripts/ci/**"
      - "accel/**"
      - "include/**"
      - "host/**"
      - "hw/**"
      - "target/**"
      - "tcg/**"
      - "ui/**"
      - "util/**"
      - "meson.build"
      - "meson_options.txt"
      - "os-win32.c"
      - "subprojects/**"
      - "winpcap-loader/**"
      - "config_spec.yml"
  workflow_dispatch:
    inputs:
      strict:
        description: Fail the workflow when MSVC validation fails
        required: false
        type: boolean
        default: false
      configure_args:
        description: Extra arguments appended to configure
        required: false
        type: string
        default: ""

concurrency:
  group: windows-msvc-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: write
  contents: read

jobs:
  deps:
    name: MSVC dependencies (x64)
    runs-on: windows-2025-vs2026
    timeout-minutes: 60
    steps:
      - name: Clone tree
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4
        with:
          fetch-depth: 1
          fetch-tags: true
          ref: ${{ inputs.ref || github.ref }}

      - name: Restore vcpkg cache
        id: vcpkg-cache
        uses: actions/cache/restore@v5
        with:
          path: |
            .vcpkg-tool
            .vcpkg-downloads
            .vcpkg-binary-cache
            subprojects\packagecache
          key: msvc-vcpkg-${{ runner.os }}-x64-x64-windows-v2-${{ hashFiles('.github/workflows/windows-msvc.yml', 'scripts/ci/windows-msvc-probe.ps1', 'scripts/ci/msvc-cl-wrapper.py', 'meson.build', 'meson_options.txt', 'subprojects/*.wrap') }}
          restore-keys: |
            msvc-vcpkg-${{ runner.os }}-x64-x64-windows-v2-
            msvc-vcpkg-${{ runner.os }}-

      - name: Ensure standalone vcpkg
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $workspace = [System.IO.Path]::GetFullPath($env:GITHUB_WORKSPACE)
          $vcpkgRoot = [System.IO.Path]::GetFullPath($env:VCPKG_ROOT)
          if (-not $vcpkgRoot.StartsWith($workspace, [System.StringComparison]::OrdinalIgnoreCase)) {
            throw "VCPKG_ROOT must stay inside the GitHub workspace: $vcpkgRoot"
          }

          $vcpkgExe = Join-Path $vcpkgRoot "vcpkg.exe"
          if (-not (Test-Path -LiteralPath $vcpkgExe)) {
            if (Test-Path -LiteralPath $vcpkgRoot) {
              Remove-Item -LiteralPath $vcpkgRoot -Recurse -Force
            }
            git clone --depth 1 https://github.com/microsoft/vcpkg.git $vcpkgRoot
            & (Join-Path $vcpkgRoot "bootstrap-vcpkg.bat") -disableMetrics
          }

          & $vcpkgExe version

      - name: Warm vcpkg dependencies
        shell: pwsh
        timeout-minutes: 60
        run: |
          .\scripts\ci\windows-msvc-probe.ps1 `
            -Architecture "amd64" `
            -QemuCpu "x86_64" `
            -BuildScope "deps" `
            -BuildConfig "release"

      - name: Check dependency status
        if: always()
        shell: pwsh
        run: |
          $statusPath = "msvc-probe-logs\status.txt"
          if (-not (Test-Path $statusPath)) {
            Write-Error "MSVC dependency status file was not produced: $statusPath"
            exit 1
          }

          $status = @{}
          Get-Content $statusPath | ForEach-Object {
            if ($_ -match "^([^=]+)=(.*)$") {
              $status[$matches[1]] = $matches[2]
            }
          }

          if ($status["build_exit_code"] -ne "0") {
            Write-Error "MSVC dependency install failed: build_exit_code=$($status["build_exit_code"])"
            exit 1
          }

          Write-Host "MSVC dependency install passed."

      - name: Save vcpkg cache
        if: success() && steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            .vcpkg-tool
            .vcpkg-downloads
            .vcpkg-binary-cache
            subprojects\packagecache
          key: msvc-vcpkg-${{ runner.os }}-x64-x64-windows-v2-${{ hashFiles('.github/workflows/windows-msvc.yml', 'scripts/ci/windows-msvc-probe.ps1', 'scripts/ci/msvc-cl-wrapper.py', 'meson.build', 'meson_options.txt', 'subprojects/*.wrap') }}

      - name: Upload MSVC dependency logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: logs-deps
          path: xemu-msvc-logs
          if-no-files-found: warn

  build:
    name: MSVC ${{ matrix.build_config }} (${{ matrix.arch }})
    needs: deps
    runs-on: windows-2025-vs2026
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            vc_arch: amd64
            qemu_cpu: x86_64
            build_config: debug
          - arch: x64
            vc_arch: amd64
            qemu_cpu: x86_64
            build_config: profile
          - arch: x64
            vc_arch: amd64
            qemu_cpu: x86_64
            build_config: release
    steps:
      - name: Clone tree
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4
        with:
          fetch-depth: 1
          fetch-tags: true
          ref: ${{ inputs.ref || github.ref }}
      - name: Set XEMU version
        shell: pwsh
        env:
          PKG_VERSION: ${{ inputs.pkg_version }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:PKG_VERSION)) {
            $env:PKG_VERSION = "0.0.0-resampler-ci"
          }
          [System.IO.File]::WriteAllText(
            (Join-Path $env:GITHUB_WORKSPACE "XEMU_VERSION"),
            $env:PKG_VERSION
          )

      - name: Restore vcpkg binary cache
        id: vcpkg-cache
        uses: actions/cache/restore@v5
        with:
          path: |
            .vcpkg-tool
            .vcpkg-downloads
            .vcpkg-binary-cache
            subprojects\packagecache
          key: msvc-vcpkg-${{ runner.os }}-x64-x64-windows-v2-${{ hashFiles('.github/workflows/windows-msvc.yml', 'scripts/ci/windows-msvc-probe.ps1', 'scripts/ci/msvc-cl-wrapper.py', 'meson.build', 'meson_options.txt', 'subprojects/*.wrap') }}
          restore-keys: |
            msvc-vcpkg-${{ runner.os }}-x64-x64-windows-v2-
            msvc-vcpkg-${{ runner.os }}-

      - name: Ensure standalone vcpkg
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $workspace = [System.IO.Path]::GetFullPath($env:GITHUB_WORKSPACE)
          $vcpkgRoot = [System.IO.Path]::GetFullPath($env:VCPKG_ROOT)
          if (-not $vcpkgRoot.StartsWith($workspace, [System.StringComparison]::OrdinalIgnoreCase)) {
            throw "VCPKG_ROOT must stay inside the GitHub workspace: $vcpkgRoot"
          }

          $vcpkgExe = Join-Path $vcpkgRoot "vcpkg.exe"
          if (-not (Test-Path -LiteralPath $vcpkgExe)) {
            if (Test-Path -LiteralPath $vcpkgRoot) {
              Remove-Item -LiteralPath $vcpkgRoot -Recurse -Force
            }
            git clone --depth 1 https://github.com/microsoft/vcpkg.git $vcpkgRoot
            & (Join-Path $vcpkgRoot "bootstrap-vcpkg.bat") -disableMetrics
          }

          & $vcpkgExe version

      - name: Run Windows MSVC Build
        shell: pwsh
        timeout-minutes: 60
        env:
          BUILD_SCOPE: full
          BUILD_CONFIG: ${{ matrix.build_config }}
          STRICT: ${{ github.event_name == 'workflow_dispatch' && inputs.strict || 'false' }}
          EXTRA_CONFIGURE_ARGS: ${{ github.event_name == 'workflow_dispatch' && inputs.configure_args || '' }}
        run: |
          $strict = [System.Convert]::ToBoolean($env:STRICT)
          .\scripts\ci\windows-msvc-probe.ps1 `
            -Architecture "${{ matrix.vc_arch }}" `
            -QemuCpu "${{ matrix.qemu_cpu }}" `
            -BuildScope "$env:BUILD_SCOPE" `
            -BuildConfig "$env:BUILD_CONFIG" `
            -ExtraConfigureArgs "$env:EXTRA_CONFIGURE_ARGS" `
            -Strict:$strict

      - name: Check MSVC build status
        if: always()
        shell: pwsh
        run: |
          $statusPath = "msvc-probe-logs\status.txt"
          if (-not (Test-Path $statusPath)) {
            Write-Error "MSVC status file was not produced: $statusPath"
            exit 1
          }

          $status = @{}
          Get-Content $statusPath | ForEach-Object {
            if ($_ -match "^([^=]+)=(.*)$") {
              $status[$matches[1]] = $matches[2]
            }
          }

          $failures = @()
          foreach ($key in @("configure_exit_code", "build_exit_code")) {
            if (-not $status.ContainsKey($key) -or $status[$key] -ne "0") {
              $failures += "$key=$($status[$key])"
            }
          }

          if ($status["cv2pdb_check"] -ne "absent") {
            $failures += "cv2pdb_check=$($status["cv2pdb_check"])"
          }
          if ($status["missing_source_filename_check"] -ne "absent") {
            $failures += "missing_source_filename_check=$($status["missing_source_filename_check"])"
          }
          if ("${{ matrix.build_config }}" -ne "release" -and $status["pdb_reference_check"] -ne "passed") {
            $failures += "pdb_reference_check=$($status["pdb_reference_check"])"
          }

          if ($failures) {
            Write-Error ("MSVC ${{ matrix.build_config }} build status failed: " + ($failures -join "; "))
            exit 1
          }

          Write-Host "MSVC ${{ matrix.build_config }} build status passed."

      - name: Upload MSVC logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: logs-${{ matrix.build_config }}
          path: xemu-msvc-logs
          if-no-files-found: warn

      - name: Package MSVC build artifact
        if: always()
        shell: pwsh
        run: |
          $source = "msvc-artifacts\${{ matrix.build_config }}"
          $archive = "xemu-msvc-${{ matrix.build_config }}.zip"
          if (Test-Path -LiteralPath $source) {
            Remove-Item -LiteralPath $archive -Force -ErrorAction SilentlyContinue
            Compress-Archive -Path (Join-Path $source "*") -DestinationPath $archive
          } else {
            Write-Warning "MSVC artifact directory not found: $source"
          }

      - name: Upload MSVC build artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: xemu-msvc-${{ matrix.build_config }}.zip
          path: xemu-msvc-${{ matrix.build_config }}.zip
          if-no-files-found: ignore

  logs:
    name: Merge MSVC logs
    runs-on: ubuntu-24.04
    needs: build
    if: always()
    steps:
      - name: Download per-config logs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p xemu-msvc-logs
          gh run download "$GITHUB_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "logs-*" \
            --dir xemu-msvc-logs || true
          find xemu-msvc-logs -type f | sort

      - name: Upload merged MSVC logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: logs
          path: xemu-msvc-logs
          if-no-files-found: warn

      - name: Delete per-config log artifacts
        if: always()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $response = gh api "/repos/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID/artifacts" --paginate | ConvertFrom-Json
          $artifacts = @($response.artifacts) | Where-Object { $_.name -like "logs-*" }
          foreach ($artifact in $artifacts) {
            Write-Host "Deleting temporary log artifact $($artifact.name) [$($artifact.id)]"
            gh api -X DELETE "/repos/$env:GITHUB_REPOSITORY/actions/artifacts/$($artifact.id)"
          }
