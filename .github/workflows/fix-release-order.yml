name: Fix release order

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  fix:
    name: Fix release order
    if: github.event.head_commit.message == 'ci-fix-release-order'
    runs-on: ubuntu-latest
    steps:
      - name: Move stable release below development build
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          stable_id="$(gh api "repos/$GH_REPO/releases?per_page=100" --jq '.[] | select(.draft == false and .prerelease == false) | .id' | head -n 1)"
          printf '{"make_latest":"false"}' |
            gh api --method PATCH "repos/$GH_REPO/releases/$stable_id" --input - >/dev/null
