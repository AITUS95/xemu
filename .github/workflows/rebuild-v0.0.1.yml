name: Rebuild v0.0.1

on:
  push:
    branches:
      - master

permissions:
  actions: write
  contents: write

jobs:
  release:
    name: Rebuild v0.0.1
    if: github.event.head_commit.message == 'ci-rebuild-v0.0.1'
    uses: ./.github/workflows/release.yml
    with:
      ref: ${{ github.sha }}
      tag: v0.0.1
      pkg_version: 0.0.1
      replace-existing: true
