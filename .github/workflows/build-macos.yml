name: Build for macOS

on:
  workflow_call:
    inputs:
      pkg_version:
        description: Build version
        required: true
        type: string

jobs:
  build:
    name: Build for macOS (${{ matrix.arch }}, ${{ matrix.configuration }})
    runs-on: macos-15
    strategy:
      matrix:
        arch: [x86_64, arm64]
        configuration: [debug, release]
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1
      CCACHE_DIR: ${{ github.workspace }}/xemu-ccache
      CCACHE_MAXSIZE: 512M
      LTO_CACHE_DIR: ${{ github.workspace }}/xemu-lto-cache
    steps:
    - name: Download source package
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v4
      with:
        name: src
    - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
      with:
        python-version: '3.12'
    - name: Install dependencies
      run: |
        brew install \
          ccache \
          coreutils \
          dylibbundler
        pip install pyyaml requests
    - name: Initialize compiler, library cache
      id: cache
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v4
      with:
        path: |
          .incremental-src
          ${{ env.CCACHE_DIR }}
          ${{ env.LTO_CACHE_DIR }}
        key: cache-${{ runner.os }}-${{ matrix.arch }}-${{ matrix.configuration }}-${{ github.sha }}
        restore-keys: cache-${{ runner.os }}-${{ matrix.arch }}-${{ matrix.configuration }}-
    - name: Update incremental source tree
      run: |
        rm -rf _src_new
        mkdir -p _src_new .incremental-src
        tar -xf xemu-${{ inputs.pkg_version }}.tar.zst -C _src_new --strip-components=2
        python3 - <<'PY'
        import filecmp
        import shutil
        from pathlib import Path

        src = Path("_src_new")
        dst = Path(".incremental-src")
        keep_roots = {"build", "dist", "build.log", "macos-libs", "macos-pkgs"}
        keep_prefixes = (".build-config-",)

        for path in sorted(dst.rglob("*"), reverse=True):
            rel = path.relative_to(dst)
            if rel.parts and rel.parts[0] in keep_roots:
                continue
            if rel.name.startswith(keep_prefixes):
                continue
            other = src / rel
            if not other.exists():
                if path.is_dir():
                    try:
                        path.rmdir()
                    except OSError:
                        pass
                else:
                    path.unlink()

        for path in src.rglob("*"):
            rel = path.relative_to(src)
            out = dst / rel
            if path.is_dir():
                if out.exists() and not out.is_dir():
                    out.unlink()
                out.mkdir(parents=True, exist_ok=True)
                continue
            out.parent.mkdir(parents=True, exist_ok=True)
            if out.exists() and filecmp.cmp(path, out, shallow=False):
                continue
            if out.exists() and out.is_dir():
                shutil.rmtree(out)
            shutil.copy2(path, out)
        PY
        rm -rf _src_new
    - name: Setup ccache
      run: |
        echo "PATH=/opt/homebrew/opt/ccache/libexec:$PATH" >> "$GITHUB_ENV"
        mkdir -p ${CCACHE_DIR}
        ccache -z
    - name: Setup build options
      run: |
        if [[ "${{ matrix.configuration }}" == "debug" ]]; then
          opts=(
            --debug
          )
        else
          opts=(
            -Db_lto=true
            -Db_lto_mode=thin
            -Db_thinlto_cache=true
            -Db_thinlto_cache_dir="$LTO_CACHE_DIR"
            -Dx86_version=3
          )
          mkdir -p ${LTO_CACHE_DIR}
        fi
        echo "XEMU_BUILD_OPTIONS=${opts[*]}" >> "$GITHUB_ENV"
    - name: Compile
      run: |
        cd .incremental-src
        stamp_file=.build-config-macos-${{ matrix.arch }}-${{ matrix.configuration }}
        stamp_value="$(printf '%s\n' \
          "${stamp_file}" \
          "${{ matrix.arch }}" \
          "${{ matrix.configuration }}" \
          "${XEMU_BUILD_OPTIONS}" \
          "$(shasum -a 256 build.sh configure | shasum -a 256 | awk '{print $1}')")"

        if [[ -f build/Makefile && -f "${stamp_file}" ]] && cmp -s "${stamp_file}" <(printf '%s' "${stamp_value}"); then
          ./build.sh --skip-configure -a ${{ matrix.arch }} ${XEMU_BUILD_OPTIONS}
        else
          ./build.sh -a ${{ matrix.arch }} ${XEMU_BUILD_OPTIONS}
          printf '%s' "${stamp_value}" > "${stamp_file}"
        fi
    - name: Report ccache stats
      run: ccache -s
    - name: Package
      id: package
      env:
        VERSION: ${{ inputs.pkg_version }}${{ matrix.configuration == 'debug' && '-dbg' || '' }}
      run: |
        pkg_filename="xemu-${VERSION}-macos-${{ matrix.arch }}-unsigned.zip"
        echo "pkg_filename=${pkg_filename}" >> $GITHUB_OUTPUT

        pushd .incremental-src/dist
        zip -r ../../${pkg_filename} *
        popd
    - name: Upload build artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
      with:
        name: xemu-macos-${{ matrix.arch }}-${{ matrix.configuration }}
        path: ${{ steps.package.outputs.pkg_filename }}
        compression-level: 0
    - name: Cleanup incremental outputs
      run: rm -rf .incremental-src/dist

  build_universal:
    name: Build macOS Universal bundle (${{ matrix.configuration }})
    runs-on: macos-15
    needs: build
    strategy:
      matrix:
        configuration: [debug, release]
    steps:
    - name: Download architecture-specific builds
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v4
      with:
        pattern: "xemu-macos-*-${{ matrix.configuration }}"
        merge-multiple: true
    - name: Build Universal bundle
      run: |
        mkdir dist
        pushd dist
        for arch in x86_64 arm64; do
          unzip -o ../xemu-*-${arch}-unsigned.zip
          mv xemu.app/Contents/MacOS/xemu ../xemu_${arch}
        done
        lipo -create -output xemu.app/Contents/MacOS/xemu ../xemu_x86_64 ../xemu_arm64
        codesign --force --deep --preserve-metadata=entitlements,requirements,flags,runtime --sign - xemu.app/Contents/MacOS/xemu
        popd
    - name: Package
      id: package
      env:
        VERSION: ${{ inputs.pkg_version }}${{ matrix.configuration == 'debug' && '-dbg' || '' }}
      run: |
        pkg_filename="xemu-${VERSION}-macos-universal-unsigned.zip"
        echo "pkg_filename=${pkg_filename}" >> $GITHUB_OUTPUT
        pushd dist
        zip -r ../${pkg_filename} *
        popd
    - name: Upload build artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
      with:
        name: xemu-macos-universal-${{ matrix.configuration }}
        path: ${{ steps.package.outputs.pkg_filename }}
        compression-level: 0
