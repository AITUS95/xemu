name: Release

on:
  workflow_call:
    inputs:
      ref:
        description: "Git ref to build and release"
        required: true
        type: string
      tag:
        description: "Tag name for the release"
        required: true
        type: string
      pkg_version:
        description: "Explicit package version without a leading v"
        required: false
        type: string
      pre-release:
        description: "Create as published pre-release instead of draft release"
        required: false
        type: boolean
        default: false
      publish:
        description: "Publish a stable release immediately"
        required: false
        type: boolean
        default: false

permissions:
  actions: write
  contents: write

jobs:
  build:
    name: Build
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ inputs.ref }}
      pkg_version: ${{ inputs.pkg_version }}

  msvc:
    name: Windows MSVC
    needs: build
    uses: ./.github/workflows/windows-msvc.yml
    with:
      ref: ${{ inputs.ref }}
      pkg_version: ${{ needs.build.outputs.pkg_version }}

  delete_prerelease:
    name: Delete pre-release
    needs: [build, msvc]
    if: ${{ inputs.pre-release }}
    uses: ./.github/workflows/delete-prerelease.yml

  release:
    name: Create release
    runs-on: ubuntu-latest
    needs: [build, msvc, delete_prerelease]
    if: >-
      ${{ always() && needs.build.result == 'success' &&
      needs.msvc.result == 'success' &&
      (needs.delete_prerelease.result == 'success' ||
      needs.delete_prerelease.result == 'skipped') }}
    steps:
    - name: Clone tree
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4
      with:
        fetch-depth: 0
        ref: ${{ inputs.ref }}
    - name: Generate release notes
      env:
        GH_TOKEN: ${{ github.token }}
      run: python3 .github/scripts/gen-changelog.py --ref ${{ inputs.ref }} -o CHANGELOG.md
    - name: Download artifacts
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v4
      with:
        path: dist
        merge-multiple: true
    - name: Filter release assets
      run: |
        find dist -type f -name '*.tgz' -delete
        find dist -type f \( \
          -name '*-macos-arm64-unsigned.zip' -o \
          -name '*-macos-x86_64-unsigned.zip' \
        \) -delete
        if [ "${{ inputs.pre-release }}" != "true" ]; then
          rm -f dist/xemu-msvc-debug.zip dist/xemu-msvc-profile.zip
          cp "dist/xemu-${{ needs.build.outputs.pkg_version }}-macos-universal-unsigned.zip" \
             "dist/xemu-${{ needs.build.outputs.pkg_version }}-macos-universal.zip"
        fi
    - name: Add transitionary package aliases
      if: ${{ !inputs.pre-release }}
      run: |
        pushd dist
        cp xemu-${{ needs.build.outputs.pkg_version }}-windows-x86_64.zip xemu-win-x86_64-release.zip
        cp xemu-${{ needs.build.outputs.pkg_version }}-windows-arm64.zip xemu-win-aarch64-release.zip
    - name: Normalize MSVC asset names
      env:
        PKG_VERSION: ${{ needs.build.outputs.pkg_version }}
      run: |
        set -euo pipefail
        for config in release profile debug; do
          source="dist/xemu-msvc-${config}.zip"
          if [ -f "$source" ]; then
            mv "$source" "dist/xemu-${PKG_VERSION}-msvc-${config}.zip"
          fi
        done

    - name: Delete existing stable release
      if: ${{ !inputs.pre-release && inputs.publish }}
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
      run: |
        set -euo pipefail
        release_id="$(gh api "repos/$GH_REPO/releases/tags/${{ inputs.tag }}" --jq '.id' 2>/dev/null || true)"
        if [ -n "$release_id" ]; then
          gh api --method DELETE "repos/$GH_REPO/releases/$release_id"
        fi

    - name: Create release
      uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
      with:
        name: ${{ inputs.pre-release && 'Latest Development Build' || inputs.tag }}
        tag_name: ${{ inputs.tag }}
        target_commitish: ${{ inputs.ref }}
        body_path: CHANGELOG.md
        draft: ${{ !inputs.pre-release && !inputs.publish }}
        prerelease: ${{ inputs.pre-release }}
        make_latest: false
        files: |
          dist/xemu*.tar.zst
          dist/xemu*-win*.zip
          dist/xemu*-macos-universal*.zip
          dist/xemu*.AppImage
          dist/xemu*-msvc-*.zip

    - name: Keep stable release below development build
      if: ${{ inputs.pre-release }}
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
      run: |
        set -euo pipefail
        stable_id="$(gh api "repos/$GH_REPO/releases?per_page=100" \
          --jq '.[] | select(.draft == false and .prerelease == false) | .id' | head -n 1)"
        if [ -n "$stable_id" ]; then
          gh api --method PATCH "repos/$GH_REPO/releases/$stable_id" \
            -f make_latest=false >/dev/null
        fi
