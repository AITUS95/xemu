name: Windows MSVC Native Build

env:
  VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\.vcpkg-binary-cache
  VCPKG_FEATURE_FLAGS: binarycaching

on:
  push:
    branches:
      - MSVC
    paths:
      - ".github/workflows/**"
      - "scripts/ci/**"
      - "include/**"
      - "host/**"
      - "hw/**"
      - "ui/**"
      - "util/**"
      - "meson.build"
      - "meson_options.txt"
      - "subprojects/**"
      - "winpcap-loader/**"
      - "config_spec.yml"
  workflow_dispatch:
    inputs:
      build_scope:
        description: "MSVC native build scope"
        required: false
        default: "fast"
        type: choice
        options:
          - fast
          - core
          - full
      build_config:
        description: "MSVC native build configuration"
        required: false
        default: "profile"
        type: choice
        options:
          - debug
          - profile
          - release
          - all
      strict:
        description: Fail the workflow when MSVC native validation fails
        required: false
        type: boolean
        default: false
      configure_args:
        description: Extra arguments appended to configure
        required: false
        type: string
        default: ""

concurrency:
  group: windows-msvc-native-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  configure:
    name: Build with MSVC (${{ matrix.arch }})
    runs-on: windows-2022
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            vc_arch: amd64
            qemu_cpu: x86_64
    steps:
      - name: Clone tree
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4
        with:
          fetch-depth: 1
          fetch-tags: true

      - name: Restore vcpkg binary cache
        uses: actions/cache/restore@v4
        with:
          path: |
            .vcpkg-binary-cache
            C:\vcpkg\downloads
            C:\Users\runneradmin\AppData\Local\vcpkg\archives
            subprojects\packagecache
          key: msvc-vcpkg-${{ runner.os }}-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            msvc-vcpkg-${{ runner.os }}-v1-
            msvc-vcpkg-${{ runner.os }}-

      - name: Run Windows MSVC Native Build
        shell: pwsh
        timeout-minutes: 60
        env:
          BUILD_SCOPE: ${{ github.event_name == 'workflow_dispatch' && inputs.build_scope || 'fast' }}
          BUILD_CONFIG: ${{ github.event_name == 'workflow_dispatch' && inputs.build_config || 'profile' }}
          STRICT: ${{ inputs.strict || 'false' }}
          EXTRA_CONFIGURE_ARGS: ${{ inputs.configure_args || '' }}
        run: |
          $strict = [System.Convert]::ToBoolean($env:STRICT)
          .\scripts\ci\windows-msvc-probe.ps1 `
            -Architecture "${{ matrix.vc_arch }}" `
            -QemuCpu "${{ matrix.qemu_cpu }}" `
            -BuildScope "$env:BUILD_SCOPE" `
            -BuildConfig "$env:BUILD_CONFIG" `
            -ExtraConfigureArgs "$env:EXTRA_CONFIGURE_ARGS" `
            -Strict:$strict

      - name: Save vcpkg binary cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            .vcpkg-binary-cache
            C:\vcpkg\downloads
            C:\Users\runneradmin\AppData\Local\vcpkg\archives
            subprojects\packagecache
          key: msvc-vcpkg-${{ runner.os }}-v1-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload MSVC native logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: xemu-msvc-logs
          path: xemu-msvc-logs
          if-no-files-found: warn

      - name: Upload MSVC release artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: xemu-msvc-release
          path: msvc-native-artifacts/release
          if-no-files-found: ignore

      - name: Upload MSVC debug artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: xemu-msvc-debug
          path: msvc-native-artifacts/debug
          if-no-files-found: ignore

      - name: Upload MSVC profiling artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: xemu-msvc-profiling
          path: msvc-native-artifacts/profile
          if-no-files-found: ignore
