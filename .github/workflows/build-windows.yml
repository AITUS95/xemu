name: Build for Windows

on:
  workflow_call:
    inputs:
      pkg_version:
        description: Build version
        required: true
        type: string

jobs:
  build:
    name: Build for Windows (${{ matrix.arch }}, ${{ matrix.configuration }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [x86_64, arm64]
        configuration: [debug, release]
    container:
      image: ghcr.io/xemu-project/xemu-win64-toolchain${{ matrix.arch == 'x86_64' && '-gcc:sha-18018f1' || ':sha-0d06ce8' }}
    defaults:
      run:
        shell: bash
    env:
      CCACHE_DIR: /tmp/xemu-ccache
      CCACHE_MAXSIZE: 512M
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_NOHASHDIR: "true"
      LTO_CACHE_DIR: /tmp/xemu-lto-ccache
      CROSSPREFIX: ${{ matrix.arch == 'arm64' && 'aarch64' || 'x86_64' }}-w64-mingw32.static-
      CROSSAR: ${{ matrix.arch == 'arm64' && 'aarch64' || 'x86_64' }}-w64-mingw32.static-${{ matrix.arch == 'arm64' && 'ar' || 'gcc-ar' }}
    steps:
    - name: Download source package
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v4
      with:
        name: src
    - name: Install zstd
      if: ${{ matrix.arch == 'arm64' }}
      run: apt-get install zstd
    - name: Initialize compiler cache
      id: cache
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v4
      with:
        path: |
          .incremental-src
          ${{ env.CCACHE_DIR }}
          ${{ env.LTO_CACHE_DIR }}
        key: cache-wincross-${{ runner.os }}-${{ matrix.arch }}-${{ matrix.configuration }}-${{ github.sha }}
        restore-keys: cache-wincross-${{ runner.os }}-${{ matrix.arch }}-${{ matrix.configuration }}-
    - name: Update incremental source tree
      run: |
        rm -rf _src_new
        mkdir -p _src_new .incremental-src
        tar -xf xemu-${{ inputs.pkg_version }}.tar.zst -C _src_new --strip-components=2
        python3 - <<'PY'
        import filecmp
        import os
        import shutil
        from pathlib import Path

        src = Path("_src_new")
        dst = Path(".incremental-src")
        keep_roots = {"build", "dist", "pdb-build", "build.log"}

        for path in sorted(dst.rglob("*"), reverse=True):
            rel = path.relative_to(dst)
            if rel.parts and rel.parts[0] in keep_roots:
                continue
            other = src / rel
            if not other.exists():
                if path.is_dir():
                    try:
                        path.rmdir()
                    except OSError:
                        pass
                else:
                    path.unlink()

        for path in src.rglob("*"):
            rel = path.relative_to(src)
            out = dst / rel
            if path.is_dir():
                if out.exists() and not out.is_dir():
                    out.unlink()
                out.mkdir(parents=True, exist_ok=True)
                continue
            out.parent.mkdir(parents=True, exist_ok=True)
            if out.exists() and filecmp.cmp(path, out, shallow=False):
                continue
            if out.exists() and out.is_dir():
                shutil.rmtree(out)
            shutil.copy2(path, out)
        PY
        rm -rf _src_new
    - name: Setup ccache
      run: |
        mkdir -p ${CCACHE_DIR} /tmp/ccache-wrappers
        for tool in gcc g++; do
          ln -sf "$(command -v ccache)" "/tmp/ccache-wrappers/${CROSSPREFIX}${tool}"
        done
        echo "PATH=/tmp/ccache-wrappers:$PATH" >> "$GITHUB_ENV"
        ccache -z
    - name: Setup build options
      run: |
        if [[ "${{ matrix.configuration }}" == "debug" ]]; then
          opts=(
            --debug
          )
        elif [[ "${{ matrix.arch }}" == "x86_64" ]]; then
          opts=(
            --extra-cflags="-flto-incremental=${LTO_CACHE_DIR} -flto-partition=cache"
            -Db_lto=true
          )
          mkdir -p ${LTO_CACHE_DIR}
        elif [[ "${{ matrix.arch }}" == "arm64" ]]; then
          # FIXME: llvm-mingw ThinLTO has an issue with `qemu_build_not_reached_always`
          #        being intentionaly undefined (to ensure 'unreachable' paths are
          #        optimized out). Regular LTO doesn't pass cv2pdb. Resolve linking
          #        failure and have llvm toolchain generate PDB directly.
          opts=()
        fi
        echo "XEMU_BUILD_OPTIONS=${opts[*]}" >> "$GITHUB_ENV"
    - name: Compile
      run: cd .incremental-src && ./build.sh -p win64-cross ${XEMU_BUILD_OPTIONS}
    - name: Report ccache stats
      run: ccache -s
    - name: Upload build artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
      with:
        name: xemu-windows-${{ matrix.arch }}-${{ matrix.configuration }}
        path: .incremental-src/dist
    - name: Cleanup incremental tree
      if: always()
      run: rm -rf .incremental-src/dist .incremental-src/pdb-build

  # Generate a symbols package for Windows. Use cv2pdb to generate PDBs from
  # DWARF and update + strip the executable. Re-package the original release
  # and create symbols package.
  generate_pdb:
    name: Generate PDB for Windows (${{ matrix.arch }}, ${{ matrix.configuration }})
    runs-on: windows-latest
    needs: build
    strategy:
      matrix:
        arch: [x86_64, arm64]
        configuration: [debug, release]
    steps:
    - name: Download artifacts
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v4
      with:
        name: xemu-windows-${{ matrix.arch }}-${{ matrix.configuration }}
        path: dist
    - name: Generate PDB
      run: |
        Invoke-WebRequest -Uri "https://github.com/rainers/cv2pdb/releases/download/v0.52/cv2pdb-0.52.zip" -OutFile "cv2pdb.zip"
        7z x -ocv2pdb -y cv2pdb.zip
        cd dist
        ../cv2pdb/cv2pdb64.exe xemu.exe
    - name: Determine package version
      id: package_id
      shell: bash
      env:
        VERSION: ${{ inputs.pkg_version }}${{ matrix.configuration == 'debug' && '-dbg' || '' }}
      run: |
        echo "pkg_filename=xemu-${VERSION}-windows-${{ matrix.arch }}.zip" >> $GITHUB_OUTPUT
        echo "pdb_filename=xemu-${VERSION}-windows-${{ matrix.arch }}-pdb.zip" >> $GITHUB_OUTPUT
    - name: Package
      run: |
        mkdir dist-pdb
        cd dist
        7z a -tzip ../dist-pdb/${{ steps.package_id.outputs.pkg_filename}} * "-xr!*.pdb"
        7z a -tzip ../dist-pdb/${{ steps.package_id.outputs.pdb_filename}} "-ir!*.pdb"
    - name: Upload build artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
      with:
        name: xemu-windows-${{ matrix.arch }}-${{ matrix.configuration }}-pdb
        path: dist-pdb
        compression-level: 0

  # Generate a release-like Windows package that keeps profiler-friendly codegen
  # and debug info. This is separate from the shipping release package so the
  # normal Windows build can keep LTO and smaller artifacts.
  build_profile:
    name: Build profiling package for Windows (x86_64)
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/xemu-project/xemu-win64-toolchain-gcc:sha-18018f1
    defaults:
      run:
        shell: bash
    env:
      CCACHE_DIR: /tmp/xemu-ccache
      CCACHE_MAXSIZE: 512M
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_NOHASHDIR: "true"
      CROSSPREFIX: x86_64-w64-mingw32.static-
      CROSSAR: x86_64-w64-mingw32.static-gcc-ar
    steps:
    - name: Download source package
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v4
      with:
        name: src
    - name: Initialize compiler cache
      uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v4
      with:
        path: |
          .incremental-src
          ${{ env.CCACHE_DIR }}
        key: cache-wincross-${{ runner.os }}-x86_64-profile-${{ github.sha }}
        restore-keys: cache-wincross-${{ runner.os }}-x86_64-profile-
    - name: Update incremental source tree
      run: |
        rm -rf _src_new
        mkdir -p _src_new .incremental-src
        tar -xf xemu-${{ inputs.pkg_version }}.tar.zst -C _src_new --strip-components=2
        python3 - <<'PY'
        import filecmp
        import os
        import shutil
        from pathlib import Path

        src = Path("_src_new")
        dst = Path(".incremental-src")
        keep_roots = {"build", "dist", "pdb-build", "build.log"}

        for path in sorted(dst.rglob("*"), reverse=True):
            rel = path.relative_to(dst)
            if rel.parts and rel.parts[0] in keep_roots:
                continue
            other = src / rel
            if not other.exists():
                if path.is_dir():
                    try:
                        path.rmdir()
                    except OSError:
                        pass
                else:
                    path.unlink()

        for path in src.rglob("*"):
            rel = path.relative_to(src)
            out = dst / rel
            if path.is_dir():
                if out.exists() and not out.is_dir():
                    out.unlink()
                out.mkdir(parents=True, exist_ok=True)
                continue
            out.parent.mkdir(parents=True, exist_ok=True)
            if out.exists() and filecmp.cmp(path, out, shallow=False):
                continue
            if out.exists() and out.is_dir():
                shutil.rmtree(out)
            shutil.copy2(path, out)
        PY
        rm -rf _src_new
    - name: Setup ccache
      run: |
        mkdir -p ${CCACHE_DIR} /tmp/ccache-wrappers
        for tool in gcc g++; do
          ln -sf "$(command -v ccache)" "/tmp/ccache-wrappers/${CROSSPREFIX}${tool}"
        done
        echo "PATH=/tmp/ccache-wrappers:$PATH" >> "$GITHUB_ENV"
        ccache -z
    - name: Compile profiling build
      run: >
        cd .incremental-src &&
        ./build.sh -p win64-cross
        --enable-debug-info
        --disable-lto
        --disable-strip
        --extra-cflags="-gdwarf-4 -g3 -fno-omit-frame-pointer -fno-optimize-sibling-calls"
        --extra-ldflags="-Wl,--build-id=sha1"
    - name: Report ccache stats
      run: ccache -s
    - name: Upload build artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
      with:
        name: xemu-windows-x86_64-profile
        path: .incremental-src/dist
        compression-level: 0
    - name: Cleanup incremental tree
      if: always()
      run: rm -rf .incremental-src/dist .incremental-src/pdb-build

  generate_profile_pdb:
    name: Generate profiling package for Windows (x86_64)
    runs-on: windows-latest
    needs: build_profile
    steps:
    - name: Download artifacts
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v4
      with:
        name: xemu-windows-x86_64-profile
        path: dist
    - name: Generate PDB
      run: |
        Invoke-WebRequest -Uri "https://github.com/rainers/cv2pdb/releases/download/v0.52/cv2pdb-0.52.zip" -OutFile "cv2pdb.zip"
        7z x -ocv2pdb -y cv2pdb.zip
        New-Item -ItemType Directory -Force -Path pdb-build | Out-Null
        Copy-Item dist/xemu.exe pdb-build/xemu.exe
        Push-Location pdb-build
        ../cv2pdb/cv2pdb64.exe xemu.exe
        Pop-Location
        Copy-Item pdb-build/xemu.pdb dist/xemu.pdb
    - name: Upload build artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
      with:
        name: xemu-windows-x86_64-profile
        path: dist
        compression-level: 6
        overwrite: true
