name: Release (Dispatched)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing or new semantic version tag to update
        required: false
        type: string
        default: ""

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tag:
    name: Determine release version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      pkg_version: ${{ steps.version.outputs.pkg_version }}
    steps:
    - name: Determine new tag version
      id: version
      env:
        GH_TOKEN: ${{ github.token }}
        TAG_OVERRIDE: ${{ inputs.tag }}
      run: |
        if [ -n "$TAG_OVERRIDE" ]; then
          next="$TAG_OVERRIDE"
        else
          latest=$(
            {
              git ls-remote --tags --refs "https://github.com/${GITHUB_REPOSITORY}.git" |
                awk '{print $2}' | sed 's#refs/tags/##'
              gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --jq '.[].tag_name' || true
            } |
              grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' |
              sort -V |
              tail -n 1
          )
          [ -z "$latest" ] && latest="v0.0.0"
          ver="${latest#v}"
          IFS=. read -r major minor patch <<< "$ver"
          next="v${major}.${minor}.$((patch+1))"
        fi

        if ! [[ "$next" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "Invalid semantic version tag: $next" >&2
          exit 1
        fi

        echo "tag=$next" >> "$GITHUB_OUTPUT"
        echo "pkg_version=${next#v}" >> "$GITHUB_OUTPUT"

  release:
    name: Release
    needs: tag
    uses: ./.github/workflows/release.yml
    with:
      ref: ${{ github.sha }}
      tag: ${{ needs.tag.outputs.tag }}
      pkg_version: ${{ needs.tag.outputs.pkg_version }}
